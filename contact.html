    <h2>📝 Send Me a Message</h2>
    <form onsubmit="return validateContact()">
        <label>Your Name:</label><br>
        <input type="text" id="contactName" placeholder="Your name" required><br><br>

        <label>Your Email:</label><br>
        <input type="email" id="contactEmail" placeholder="Your email" required><br><br>

        <label>Message:</label><br>
        <textarea id="contactMessage" placeholder="Write your message here..." required></textarea><br><br>

        <button type="submit" class="book-btn">Send Message</button>
    </form>

    <script>
        function validateContact() {
            let name = document.getElementById("contactName").value;
            let email = document.getElementById("contactEmail").value;
            let message = document.getElementById("contactMessage").value;

            if (name === "" || email === "" || message === "") {
                alert("❌ Please fill in all fields!");
                return false;
            } else {
                alert("✅ Thank you, " + name + "! I'll get back to you soon! 💖");
                return true;
            }
        }
